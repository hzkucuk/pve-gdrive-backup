# pve-gdrive-backup — Portainer / docker compose
#
# ONEMLI: Bu araci NEREDE calistirdigin yetenegini belirler.
#
#   A) Proxmox HOST uzerinde Docker  -> tam yetenek (asagidaki ayarlarla)
#   B) Ayri bir VM/makinede Docker   -> dump klasoru ag uzerinden paylasilmali;
#      vzdump surec/kilit tespiti CALISMAZ, yalnizca "yazilmakta olan dosya"
#      korumasi kalir (min_age_min + skip_patterns). Plan saatini Proxmox'un
#      yedek penceresinin disina almak sart.
#
# Ilk kurulum sonrasi Google hesabi eklemek icin konteynerde:
#   docker exec -it pve-gdrive rclone authorize drive --drive-scope drive.file --auth-no-open-browser

services:
  pve-gdrive:
    build: .
    # image: ghcr.io/hzkucuk/pve-gdrive-backup:latest
    container_name: pve-gdrive
    restart: unless-stopped

    # --- A secenegi: Proxmox host uzerinde calisiyorsa ---
    # network_mode: host    # /proc/net/dev'den GERCEK hat trafigi okunur (otomatik bant genisligi)
    # pid: host             # vzdump sureci tespit edilebilir

    # --- B secenegi: ayri makinede calisiyorsa (varsayilan) ---
    ports:
      - "8787:8787"

    volumes:
      # Yapilandirma ve durum (kalici olmali)
      - pve-gdrive-config:/config
      - pve-gdrive-state:/var/lib/pve-gdrive
      # rclone hesap jetonlari (kalici olmali, yoksa her acilista yeniden yetkilendirirsin)
      - pve-gdrive-rclone:/root/.config/rclone

      # Yedeklerin okunacagi klasor — SALT OKUNUR baglanir.
      # A seceneginde host yolu, B seceneginde NFS/SMB baglama noktasi.
      - /mnt/pve/Usb1Tb/dump:/dump:ro

      # --- yalnizca A secenegi (Proxmox host uzerinde) ---
      # Depo kesfi (arayuzdeki "Proxmox depolari" kisayollari) ve TLS sertifikasi:
      # - /etc/pve:/etc/pve:ro
      # vzdump kilidinin tespiti:
      # - /run:/host-run:ro

    environment:
      TZ: Europe/Istanbul

    # Yedekleme isi host'u yormasin
    cpu_shares: 256
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true

volumes:
  pve-gdrive-config:
  pve-gdrive-state:
  pve-gdrive-rclone:
